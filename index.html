<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>냥냥 메모리 🐱</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 우상단 음향 설정 버튼 -->
    <button id="sound-settings-btn" class="icon-btn" aria-label="음향 설정" title="음향 설정">
      <span id="sound-icon" aria-hidden="true">🔊</span>
    </button>

    <!-- 팁 박스 -->
    <div id="tip-box" class="tip-box">
      <span class="tip-emoji">💡</span>
      <span id="tip-text">같은 동물 그림 2개를 찾아보세요!</span>
    </div>

    <!-- 시작 화면 -->
    <section id="start-screen" class="screen">
      <h1 class="game-title">🐱 냥냥 메모리</h1>
      <p class="subtitle">같은 그림을 찾아 짝을 맞춰보세요!</p>

      <div class="difficulty-select">
        <h3>난이도 선택</h3>
        <div class="difficulty-info">
          <button class="difficulty-btn" data-difficulty="easy">
            🟢 쉬움 (4×3)
            <span class="difficulty-desc">카드 12개 - 처음엔 쉬움으로!</span>
          </button>
          <button class="difficulty-btn" data-difficulty="medium">
            🟡 보통 (4×4)
            <span class="difficulty-desc">카드 16개 - 보통은 재미있어!</span>
          </button>
          <button class="difficulty-btn" data-difficulty="hard">
            🔴 어려움 (6×4)
            <span class="difficulty-desc">카드 24개 - 최고의 도전!</span>
          </button>
        </div>
      </div>

      <button id="start-btn" class="primary-btn">🚀 게임 시작</button>
      <p class="game-hint">💫 팁: 빨리하기보다 정확하게 기억하는 게 중요해요!</p>
    </section>

    <!-- 게임 화면 -->
    <section id="game-screen" class="screen hidden">
      <div class="game-message" id="game-message"></div>

      <header id="game-header">
        <div id="score">점수: <span>0</span></div>
        <div id="moves">움직임: <span>0</span></div>
        <div id="timer">시간: <span>00:00</span></div>
      </header>

      <div id="game-board"></div>

      <div class="game-encouragement" id="encouragement"></div>

      <div class="game-actions">
        <button id="pause-btn" class="secondary-btn">⏸️ 일시정지</button>
        <button id="restart-btn" class="secondary-btn">🔄 다시하기</button>
      </div>
    </section>
  </div>

  <!-- ============== 모달(팝업) 영역 ============== -->

  <!-- 게임 종료 모달 -->
  <div id="end-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="end-message">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-content end-modal-content">
      <div class="modal-confetti" aria-hidden="true">🎊✨🎉</div>
      <h2 id="end-message">🎉 대성공!</h2>
      <div class="celebration">✨🎊✨</div>
      <div class="result-box">
        <div id="final-score">최종 점수: 0</div>
        <div id="best-score">최고 점수: 0</div>
      </div>
      <div class="result-comment" id="result-comment"></div>
      <div class="modal-actions">
        <button id="play-again-btn" class="primary-btn">한번 더! 🔁</button>
        <button id="back-to-start-btn" class="secondary-btn">🏠 처음 화면</button>
      </div>
      <p class="result-hint">다시 도전해서 점수를 더 높여보세요!</p>
    </div>
  </div>

  <!-- 음향 설정 모달 -->
  <div id="sound-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="sound-modal-title">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-content sound-modal-content">
      <button class="modal-close-btn" data-modal-close aria-label="닫기">✕</button>
      <h2 id="sound-modal-title">🔊 음향 설정</h2>

      <div class="setting-row">
        <label for="mute-toggle" class="setting-label">
          <span class="setting-icon" id="mute-icon">🔊</span>
          <span>소리</span>
        </label>
        <button id="mute-toggle" class="toggle-btn" aria-pressed="false">
          <span class="toggle-text">켜짐</span>
        </button>
      </div>

      <div class="setting-row">
        <label for="volume-slider" class="setting-label">
          <span class="setting-icon">🎚️</span>
          <span>볼륨 <span id="volume-value">60</span>%</span>
        </label>
        <input
          type="range"
          id="volume-slider"
          min="0"
          max="100"
          value="60"
          aria-label="볼륨"
        />
      </div>

      <div class="setting-row sound-test-row">
        <span class="setting-label"><span class="setting-icon">🎵</span><span>소리 테스트</span></span>
        <div class="test-btn-group">
          <button class="test-btn" data-test="flip">뒤집기</button>
          <button class="test-btn" data-test="match">매칭</button>
          <button class="test-btn" data-test="win">승리</button>
        </div>
      </div>

      <button id="sound-modal-ok" class="primary-btn modal-ok-btn">확인</button>
    </div>
  </div>

  <!-- 일시정지 모달 -->
  <div id="pause-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pause-modal-title">
    <div class="modal-backdrop"></div>
    <div class="modal-content pause-modal-content">
      <h2 id="pause-modal-title">⏸️ 일시정지</h2>
      <p>잠깐 쉬어가요. 준비되면 계속하기를 눌러주세요!</p>
      <div class="modal-actions">
        <button id="resume-btn" class="primary-btn">▶️ 계속하기</button>
        <button id="quit-btn" class="secondary-btn">🏠 처음으로</button>
      </div>
    </div>
  </div>

  <!-- 스크립트 로드 순서 중요! -->
  <script src="js/difficulty.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>

  <!-- 게임 초기화 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Sound.init();
      Modal.init();
      UI.bindEvents();
      UI.subscribeToGameEvents();
      UI.bindSoundSettings();
      Sound.subscribeToGameEvents();
      UI.showScreen('start');
    });
  </script>
</body>
</html>
